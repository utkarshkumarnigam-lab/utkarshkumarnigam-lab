name: generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: utkarshkumarnigam-lab
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0a0a0a&color_dots=#ebedf0,#c4c4c4,#8f8f8f,#5c5c5c,#1a1a1a
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f2f2f2&color_dots=#161b22,#2e2e2e,#5c5c5c,#8f8f8f,#f2f2f2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
